<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의고사 · Google Teacher Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Ctext x='16' y='23' font-size='18' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap narrow" id="body"></main>
<footer class="foot" id="foot"></footer>
<script src="js/config.js"></script>
<script src="data/content.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  const { STAGES, DOMAINS, esc, rich, store, questions, header } = window.GTL;
  header('exam.html');
  const body = document.getElementById('body');
  const N = 37;
  let track = new URLSearchParams(location.search).get('stage');
  if (!['level1', 'level2'].includes(track)) track = store.get().stage === 'level2' ? 'level2' : 'level1';
  let set = [], picks = [], cur = 0, minutes = 60, endAt = 0, timer = 0, flagged = new Set();

  // 진행 중 상태를 저장해 새로고침·이동 뒤에도 이어서 풀 수 있게
  const saveDraft = () => store.setExamDraft({ track, keys: set.map((x) => x.key), picks, cur, endAt, minutes, flagged: [...flagged] });
  function resume(d) {
    const byKey = Object.fromEntries(questions(d.track).map((x) => [x.key, x]));
    if (!d.keys.every((k) => byKey[k])) { store.setExamDraft(null); return false; } // 문제 은행이 바뀌었으면 새로 시작
    track = d.track; set = d.keys.map((k) => byKey[k]); picks = d.picks; cur = d.cur; endAt = d.endAt; minutes = d.minutes; flagged = new Set(d.flagged || []);
    if (Date.now() >= endAt) { submit(true); return true; }
    clearInterval(timer); timer = setInterval(tick, 1000); render(); return true;
  }

  // 영역별로 고르게: 영역마다 섞은 뒤 돌아가며 한 문제씩
  function sample() {
    const by = {};
    for (const x of questions(track)) (by[x.domain] = by[x.domain] || []).push(x);
    const pools = Object.values(by).map((a) => a.sort(() => Math.random() - 0.5));
    const out = [];
    while (out.length < N && pools.some((p) => p.length)) for (const p of pools) if (p.length && out.length < N) out.push(p.pop());
    return out.sort(() => Math.random() - 0.5);
  }

  function intro() {
    clearInterval(timer);
    const draft = store.examDraft();
    const hist = store.get().exams.filter((e) => e.track === track).slice(-5).reverse();
    const bank = questions(track).length;
    body.innerHTML = `
      <h1 style="font-size:1.8rem">객관식 모의고사</h1>
      ${draft ? `<div class="note green" style="margin:0 0 14px">⏸ 풀던 모의고사가 있어요 (${draft.picks.filter((p) => p !== null).length}/${draft.keys.length} 답함). <button class="btn small primary" id="resume" style="margin-left:6px">이어서 풀기</button> <button class="btn small" id="discard">버리고 새로 시작</button></div>` : ''}
      <p class="muted">미션 문제 은행(${bank}문항)에서 공식 평가 영역별로 고르게 ${N}문항을 뽑아요. 다 풀고 제출하면 영역별 결과와 해설을 보여 줘요.</p>
      <nav class="tabs" aria-label="단계">${['level1', 'level2'].map((k) => `<a href="?stage=${k}" aria-current="${k === track}">${STAGES[k].icon} ${STAGES[k].name}</a>`).join('')}</nav>
      <div class="card">
        <ul class="checks">
          <li>${N}문항 · 문제마다 보기 4개 중 하나</li>
          <li>제출하기 전에는 정답을 보여 주지 않아요. 표시해 두고 다시 볼 수 있어요.</li>
          <li>실제 시험은 객관식 37문항과 실습 시나리오 3개를 3시간 안에 풀어요(공식 안내). 실습은 6주차 금요일 '45분 실습 모의 연습'으로 따로 연습해요.</li>
          <li>이 모의고사는 스터디가 만든 문제예요. 실제 시험의 문항·난이도·배점과 같지 않아요.</li>
        </ul>
        <label class="small" style="display:block;margin:12px 0 6px"><b>제한 시간</b></label>
        <div class="btns" id="mins">${[40, 60, 90].map((t) => `<button class="btn small${t === 60 ? ' primary' : ''}" data-t="${t}">${t}분</button>`).join('')}</div>
        <div class="btns" style="margin-top:16px"><button class="btn primary" id="go">📝 시작하기</button></div>
      </div>
      ${hist.length ? `<div class="card" style="margin-top:16px"><h2 style="font-size:1.05rem">지난 결과</h2><ul class="checks small">${hist.map((e) => `<li>${esc(e.date)} · ${e.right}/${e.n} (${Math.round((e.right / e.n) * 100)}%) · ${e.mins}분 중 ${e.used}분</li>`).join('')}</ul></div>` : ''}`;
    body.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { minutes = +b.dataset.t; body.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('primary', x === b)); });
    body.querySelector('#go').onclick = () => { if (draft && !confirm('풀던 모의고사를 버리고 새로 시작할까요?')) return; startExam(); };
    const rs = body.querySelector('#resume'); if (rs) rs.onclick = () => resume(draft);
    const ds = body.querySelector('#discard'); if (ds) ds.onclick = () => { store.setExamDraft(null); intro(); };
  }

  function startExam() {
    set = sample(); picks = set.map(() => null); cur = 0; flagged = new Set();
    endAt = Date.now() + minutes * 60e3;
    clearInterval(timer); timer = setInterval(tick, 1000);
    saveDraft(); render();
  }
  function tick() {
    const left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    const el = document.getElementById('time');
    if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (!left) submit(true);
  }

  function render() {
    saveDraft();
    const x = set[cur], q = x.q;
    const done = picks.filter((p) => p !== null).length;
    body.innerHTML = `
      <div class="exam-bar"><span>${STAGES[track].icon} ${STAGES[track].name} 모의고사 · <b>${done}</b>/${set.length} 답함</span><span class="time" id="time" aria-live="off"></span><button class="btn small primary" id="sub">제출</button></div>
      <div class="card qcard" style="margin-top:14px">
        <p class="qnum">문제 ${cur + 1} <label class="small" style="float:right;font-weight:600"><input type="checkbox" id="flag"${flagged.has(cur) ? ' checked' : ''}> 다시 보기 표시</label></p>
        <p style="font-weight:700;font-size:1.05rem">${rich(q.q)}</p>
        <div>${q.options.map((o, k) => `<button class="quiz-opt${picks[cur] === k ? ' picked' : ''}" data-i="${k}">${String.fromCharCode(9312 + k)} ${rich(o)}</button>`).join('')}</div>
        <div class="panel-nav"><button class="btn" id="pv"${cur ? '' : ' style="visibility:hidden"'}>← 이전</button><button class="btn" id="nx">${cur < set.length - 1 ? '다음 →' : '처음으로'}</button></div>
      </div>
      <div class="card" style="margin-top:14px"><p class="small" style="margin:0 0 8px"><b>문제 바로가기</b> <span class="tiny">초록 = 답함 · 테두리 = 지금 · ★ = 다시 보기</span></p>
        <div class="qgrid">${set.map((_, k) => `<button data-j="${k}" class="${picks[k] !== null ? 'ans' : ''}${k === cur ? ' cur' : ''}">${k + 1}${flagged.has(k) ? '★' : ''}</button>`).join('')}</div></div>`;
    tick();
    body.querySelectorAll('.quiz-opt').forEach((b) => b.onclick = () => { picks[cur] = +b.dataset.i; if (cur < set.length - 1) cur += 1; render(); });
    body.querySelector('#flag').onchange = (e) => { e.target.checked ? flagged.add(cur) : flagged.delete(cur); render(); };
    body.querySelector('#pv').onclick = () => { cur -= 1; render(); };
    body.querySelector('#nx').onclick = () => { cur = cur < set.length - 1 ? cur + 1 : 0; render(); };
    body.querySelectorAll('[data-j]').forEach((b) => b.onclick = () => { cur = +b.dataset.j; render(); });
    body.querySelector('#sub').onclick = () => {
      const left = picks.filter((p) => p === null).length;
      if (left && !confirm(`아직 ${left}문제를 답하지 않았어요. 제출할까요?`)) return;
      submit(false);
    };
    window.scrollTo({ top: 0 });
  }

  function submit(timeout) {
    clearInterval(timer);
    const used = Math.min(minutes, Math.round((minutes * 60e3 - Math.max(0, endAt - Date.now())) / 60e3));
    const res = set.map((x, k) => ({ x, pick: picks[k], right: picks[k] === x.q.answer }));
    // 학습 기록에 반영: 첫 시도는 그대로 두고, 최근 결과와 복습 상태는 갱신 (틀리면 복습함으로)
    for (const r of res) if (r.pick !== null) store.answer(r.x.key, r.pick, r.right);
    store.setExamDraft(null);
    const right = res.filter((r) => r.right).length;
    store.addExam({ track, date: new Date().toLocaleDateString('ko-KR'), n: set.length, right, mins: minutes, used });
    const dom = {};
    for (const r of res) { const d = r.x.domain; dom[d] = dom[d] || { n: 0, right: 0 }; dom[d].n += 1; if (r.right) dom[d].right += 1; }
    const pct = Math.round((right / set.length) * 100);
    body.innerHTML = `
      <div class="card result-big">
        ${timeout ? '<p class="note small">⏰ 시간이 다 돼서 자동으로 제출했어요.</p>' : ''}
        <p class="muted" style="margin:0">${STAGES[track].name} 모의고사 결과</p>
        <p class="score">${right} <small style="font-size:1rem;color:var(--ink-3)">/ ${set.length}</small></p>
        <p class="muted">${pct}% · ${used}분 사용</p>
      </div>
      <div class="card" style="margin-top:14px"><h2 style="font-size:1.05rem">영역별 결과</h2>
        ${Object.entries(dom).sort().map(([d, v]) => { const p = Math.round((v.right / v.n) * 100); return `<div class="hbar"><span>${esc(DOMAINS[track][d] || '기타')}</span><div class="bar"><i class="${p < 70 ? 'low' : ''}" style="width:${p}%"></i></div><b>${p}%</b></div>`; }).join('')}
        <p class="tiny" style="margin:6px 0 0">영역은 공식 시험 가이드의 평가 영역이에요. 주황색은 70% 미만이에요.</p></div>
      <div class="card" style="margin-top:14px"><h2 style="font-size:1.05rem">틀린 문제 해설 (${res.filter((r) => !r.right).length})</h2>
        ${res.filter((r) => !r.right).map((r) => `<details style="border-top:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer"><b>${rich(r.x.q.q)}</b></summary>
          <p class="small" style="margin:8px 0 2px">내 답: ${r.pick === null ? '(답하지 않음)' : rich(r.x.q.options[r.pick])}</p>
          <p class="small" style="margin:0 0 4px;color:var(--green-ink)">정답: ${rich(r.x.q.options[r.x.q.answer])}</p>
          <p class="small muted" style="margin:0">${rich(r.x.q.why)}</p>
          <p class="tiny" style="margin:4px 0 0">관련 미션: <a href="mission.html?id=${r.x.m.id}">${esc(r.x.m.title)}</a></p></details>`).join('') || '<p class="muted">모두 맞혔어요! 🎉</p>'}
      </div>
      <div class="btns" style="margin-top:16px"><button class="btn primary" id="again">다시 풀기 (새 문제 뽑기)</button><a class="btn" href="review.html?stage=${track}">복습함 열기</a></div>`;
    body.querySelector('#again').onclick = intro;
    window.scrollTo({ top: 0 });
  }
  intro();
})();
</script>
</body>
</html>
