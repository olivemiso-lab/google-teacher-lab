<!doctype html>
<!-- 카톡·SNS 링크 미리보기 그림(img/og-image.jpg, 1200×630) 원본. 헤드리스 Edge로 1200×630 찍은 뒤 jpg로 줄인다. -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#fff;color:#1f2a44;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif}
.glow{position:absolute;left:-180px;top:-220px;width:720px;height:560px;border-radius:50%;background:radial-gradient(closest-side,#fff3c4,rgba(255,243,196,0))}
.blob{position:absolute;right:-120px;top:70px;width:760px;height:520px;border-radius:50%;background:radial-gradient(closest-side,#e8f0fe,rgba(232,240,254,0))}
.copy{position:absolute;left:64px;top:76px;width:600px}
.pill{display:inline-block;padding:9px 20px;border-radius:999px;background:#e8f0fe;color:#174ea6;font-size:22px;font-weight:800}
h1{margin:22px 0 0;font-size:56px;white-space:nowrap;line-height:1.14;font-weight:900;letter-spacing:-2.5px}
h1 em{font-style:normal;color:#1a73e8;background:linear-gradient(transparent 62%,#ffe08a 62%,#ffe08a 92%,transparent 92%)}
p{margin:24px 0 0;font-size:25px;line-height:1.55;font-weight:700;color:#4a5675}
.foot{position:absolute;left:64px;bottom:44px;font-size:18px;font-weight:600;color:#7a849c}
.art{position:absolute;right:34px;top:168px;width:490px}
.badges{position:absolute;right:70px;bottom:40px;display:flex;gap:14px}
.badges img{width:78px;height:78px;filter:drop-shadow(0 4px 8px rgba(31,42,68,.15))}
</style></head><body>
<div class="glow"></div><div class="blob"></div>
<div class="copy">
 <span class="pill">언제든 시작 · 매주 토요일 함께</span>
 <h1>스스로 공부하는<br><em>Google Teacher Lab</em></h1>
 <p>구글 공인 교육자 Level 1·2와 트레이너 준비<br>실습 미션 · 모의고사 · 토요일 Meet 스터디</p>
</div>
<img class="art" src="../img/hero-desk.webp" alt="">
<div class="badges"><img src="../img/badge-level1.webp" alt=""><img src="../img/badge-level2.webp" alt=""><img src="../img/badge-trainer.webp" alt=""></div>
<div class="foot">교사가 운영하는 무료 자율 스터디 · Google 공식 과정이 아닙니다</div>
</body></html>
